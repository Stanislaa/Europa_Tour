# ============================================================
#  Render Blueprint для сайта ООО «Европа-Тур»
#  Разворачивает: 1 веб-сервис (FastAPI + раздача фронтенда)
#                 1 базу данных PostgreSQL (бесплатный план)
#  Документация: https://render.com/docs/blueprint-spec
# ============================================================
databases:
  - name: europa-tour-db
    plan: free
    databaseName: europa_tour
    user: europa_tour

services:
  - type: web
    name: europa-tour
    runtime: python
    plan: free
    region: frankfurt          # ближайший к РФ регион Render
    rootDir: backend           # backend лежит в папке code/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api
    envVars:
      # Строка подключения к базе подставляется автоматически из europa-tour-db
      - key: DATABASE_URL
        fromDatabase:
          name: europa-tour-db
          property: connectionString
      # Секретный ключ для JWT генерируется Render автоматически
      - key: SECRET_KEY
        generateValue: true
      # Версия Python
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Автозаполнение базы тестовыми данными при первом старте
      - key: AUTO_SEED
        value: "1"
      # Адрес сайта — нужен для ссылок подтверждения в письмах.
      # Замените на реальный адрес вашего сервиса после первого деплоя.
      - key: SITE_URL
        value: "https://europa-tour.onrender.com"
      # ----- Отправка писем (SMTP) -----
      # Письма уходят на почту, только если заполнены SMTP_HOST,
      # SMTP_USER и SMTP_PASSWORD. Пока они пустые — работает демо-режим
      # (подтверждение email прямо на сайте, письмо не отправляется).
      # Значения задайте в панели Render: Dashboard → сервис → Environment.
      # НЕ вписывайте пароль в этот файл — он попадёт в репозиторий.
      - key: SMTP_HOST
        sync: false          # например smtp.gmail.com или smtp.yandex.ru
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false          # полный адрес почты-отправителя
      - key: SMTP_PASSWORD
        sync: false          # пароль приложения (НЕ обычный пароль!)
      - key: SMTP_FROM_NAME
        value: "Европа-Тур"
